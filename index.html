<!DOCTYPE html>
<html>
<head>
    <title>Sinema Odası</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        iframe { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        const videoId = new URLSearchParams(window.location.search).get('v') || 'dQw4w9WgXcQ';
        const playerDiv = document.getElementById('player');
        
        // YouTube'u doğrudan iframe ile çağıralım, bu Discord'un içine gömmeyi daha çok sever
        playerDiv.innerHTML = `
            <iframe 
                src="https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&rel=0&modestbranding=1" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
            </iframe>
        `;
    </script>
</body>
</html>
